<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: radial-gradient(circle at center, #250b20 0%, #0b0712 45%, #030308 100%);
            color: white;
            font-family: Arial, sans-serif;
            user-select: none;
            cursor: pointer;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .message {
            position: fixed;
            left: 50%;
            top: 9%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 80, 150, 0.7);
        }

        .message h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 58px);
            font-weight: 600;
        }

        .message p {
            margin: 10px 0 0;
            font-size: clamp(13px, 2vw, 18px);
            opacity: 0.75;
        }

        .hint {
            position: fixed;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 3px;
            opacity: 0.55;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <div class="message">
        <h1>Для тебя ❤️</h1>
        <p>просто потому что ты особенная</p>
    </div>

    <div class="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ СНОВА</div>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        let centerX = 0;
        let centerY = 0;
        let scale = 1;

        let progress = 0;
        let startTime = performance.now();
        let animationFinished = false;

        const DRAW_TIME = 5200;
        const PARTICLE_COUNT = 180;

        const particles = [];

        function resizeCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * pixelRatio;
            canvas.height = height * pixelRatio;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            centerX = width / 2;
            centerY = height / 2 + 30;

            scale = Math.min(width, height) / 36;
        }

        function createParticles() {
            particles.length = 0;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.15,
                    phase: Math.random() * Math.PI * 2,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        // Параметрическое уравнение сердца.
        // Здесь используются синусы и косинусы.
        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return 13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);
        }

        function easeInOut(value) {
            return value < 0.5
                ? 2 * value * value
                : 1 - Math.pow(-2 * value + 2, 2) / 2;
        }

        function drawParticles(time) {
            for (const particle of particles) {
                particle.y -= particle.speed;

                if (particle.y < -10) {
                    particle.y = height + 10;
                }

                const flicker = 0.7 + Math.sin(time * 0.002 + particle.phase) * 0.3;

                ctx.beginPath();
                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(255, 120, 190, ${particle.alpha * flicker})`;
                ctx.fill();
            }
        }

        function drawHeart(time) {
            const totalSteps = 900;
            const visibleSteps = Math.max(2, Math.floor(totalSteps * progress));

            const pulse = animationFinished
                ? 1 + Math.sin(time * 0.004) * 0.035
                : 1;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(scale * pulse, -scale * pulse);

            // Мягкое свечение.
            ctx.shadowBlur = 22;
            ctx.shadowColor = "rgba(255, 50, 130, 0.9)";
            ctx.strokeStyle = "rgba(255, 70, 150, 0.95)";
            ctx.lineWidth = 0.32;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.beginPath();

            for (let i = 0; i < visibleSteps; i++) {
                const t = (i / (totalSteps - 1)) * Math.PI * 2;
                const x = heartX(t);
                const y = heartY(t);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.stroke();
            ctx.restore();

            // Светящаяся точка, которая движется по линии во время рисования.
            if (!animationFinished) {
                const t = progress * Math.PI * 2;
                const pointX = centerX + heartX(t) * scale;
                const pointY = centerY - heartY(t) * scale;

                ctx.beginPath();
                ctx.arc(pointX, pointY, 5, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "rgba(255, 100, 180, 1)";
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawParticles(time);

            if (!animationFinished) {
                const elapsed = time - startTime;
                const rawProgress = Math.min(elapsed / DRAW_TIME, 1);
                progress = easeInOut(rawProgress);

                if (rawProgress >= 1) {
                    animationFinished = true;
                    progress = 1;
                }
            }

            drawHeart(time);

            requestAnimationFrame(animate);
        }

        function restartAnimation() {
            progress = 0;
            animationFinished = false;
            startTime = performance.now();
        }

        window.addEventListener("resize", () => {
            resizeCanvas();
            createParticles();
        });

        window.addEventListener("click", restartAnimation);
        window.addEventListener("touchstart", restartAnimation, { passive: true });

        resizeCanvas();
        createParticles();
        requestAnimationFrame(animate);
    </script>

</body>
</html>

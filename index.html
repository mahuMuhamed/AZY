<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сердце из синусов</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#05050b;color:#fff}
body{overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.overlay{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:radial-gradient(circle at center,rgba(130,20,80,.14),transparent 42%)}
h1{font-size:clamp(2.2rem,7vw,5.5rem);margin:0 0 10px;letter-spacing:-.05em;text-shadow:0 0 30px rgba(255,70,150,.5)}
p{margin:0 0 28px;color:#b9b9c8;font-size:clamp(.95rem,2vw,1.15rem)}
.card{width:min(720px,94vw);padding:22px 24px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(10,10,18,.62);backdrop-filter:blur(14px);box-shadow:0 20px 70px rgba(0,0,0,.4)}
.formula{font-family:ui-monospace,SFMono-Regular,monospace;color:#ff8bc2;line-height:1.8;font-size:clamp(.78rem,2vw,1rem)}
.controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
button{border:1px solid rgba(255,255,255,.15);background:#171722;color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px);background:#242435}
.badge{display:inline-block;margin-bottom:15px;padding:6px 11px;border-radius:999px;background:rgba(255,55,140,.1);border:1px solid rgba(255,100,170,.2);color:#ff8bc2;font-size:.8rem}
footer{position:fixed;bottom:14px;left:0;right:0;z-index:2;text-align:center;color:#686878;font-size:.75rem}
</style>
</head>
<body>
<canvas id="heart"></canvas>

<div class="overlay">
  <div class="badge">TRIGONOMETRIC ART</div>
  <h1>Сердце из синусов</h1>
  <p>Оно буквально собирается из математических точек.</p>

  <div class="card">
    <div class="formula">
      x(t) = 16 sin³(t)<br>
      y(t) = 13 cos(t) − 5 cos(2t) − 2 cos(3t) − cos(4t)
    </div>
    <div class="controls">
      <button id="rebuild">Собрать заново</button>
      <button id="pulse">Пульсация: ON</button>
    </div>
  </div>
</div>

<footer>sin • cos • π • ♥</footer>

<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');
let W,H,dpr, points=[], progress=0, rebuilding=true, pulse=true, start=performance.now();

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildPoints();
}
function heart(t){
  const x=16*Math.sin(t)**3;
  const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return [x,y];
}
function buildPoints(){
  points=[];
  const n=850;
  for(let i=0;i<n;i++){
    const t=(Math.PI*2*i)/(n-1);
    const [x,y]=heart(t);
    points.push({x,y,t});
  }
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  const elapsed=now-start;
  if(rebuilding) progress=Math.min(1,elapsed/2400);
  else progress=1;
  if(progress>=1) rebuilding=false;

  const scale=Math.min(W/38,H/31)*0.82;
  const amp=pulse ? 1+Math.sin(now/420)*0.035 : 1;
  const cx=W/2, cy=H/2+25;

  // subtle particles
  for(let i=0;i<45;i++){
    const a=i*1.73;
    const x=(Math.sin(a*2.1)*.48+.5)*W;
    const y=(Math.cos(a*1.7)*.48+.5)*H;
    ctx.fillStyle='rgba(255,90,165,.08)';
    ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();
  }

  const count=Math.floor(points.length*progress);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(scale*amp,-scale*amp);

  // glow
  ctx.shadowBlur=12/scale;
  ctx.shadowColor='rgba(255,45,135,.9)';
  ctx.lineWidth=0.045/scale;
  ctx.strokeStyle='rgba(255,85,160,.55)';
  ctx.beginPath();
  for(let i=0;i<count;i++){
    const p=points[i];
    if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  // mathematical points
  ctx.shadowBlur=5/scale;
  ctx.fillStyle='#ff78b5';
  for(let i=0;i<count;i+=3){
    const p=points[i];
    ctx.beginPath();ctx.arc(p.x,p.y,0.055/scale,0,Math.PI*2);ctx.fill();
  }

  // inner highlight after assembly
  if(!rebuilding){
    ctx.shadowBlur=25/scale;
    ctx.fillStyle='rgba(255,60,145,.11)';
    ctx.beginPath();
    for(let i=0;i<points.length;i++){
      const p=points[i];
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(draw);
}

document.getElementById('rebuild').onclick=()=>{
  rebuilding=true; progress=0; start=performance.now();
};
document.getElementById('pulse').onclick=(e)=>{
  pulse=!pulse;
  e.target.textContent='Пульсация: '+(pulse?'ON':'OFF');
};
addEventListener('resize',resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>

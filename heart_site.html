<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, #24112f 0%, #0b0712 45%, #030207 100%);
            color: white;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 7vw, 72px);
            text-shadow: 0 0 20px rgba(255, 80, 150, 0.8);
        }

        p {
            margin: 12px 0 0;
            font-size: clamp(15px, 2.5vw, 22px);
            opacity: 0.8;
        }

        .hint {
            margin-top: 28px;
            font-size: 12px;
            letter-spacing: 3px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <canvas id="heartCanvas"></canvas>

    <div class="content">
        <h1>Для тебя ❤️</h1>
        <p>просто потому что ты особенная</p>
        <div class="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ СНОВА</div>
    </div>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let scale;
        let animationStart = performance.now();
        let animationDuration = 5200;
        let isFinished = false;

        const particles = [];
        const particleCount = 250;

        function resizeCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * pixelRatio;
            canvas.height = height * pixelRatio;

            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            scale = Math.min(width, height) / 34;
        }

        function createParticles() {
            particles.length = 0;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.35 + 0.05,
                    alpha: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawParticles() {
            for (const particle of particles) {
                particle.y -= particle.speed;

                if (particle.y < 0) {
                    particle.y = height;
                    particle.x = Math.random() * width;
                }

                ctx.beginPath();
                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(255, 120, 180, ${particle.alpha})`;
                ctx.fill();
            }
        }

        // Параметрические уравнения сердца.
        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return 13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);
        }

        function easeInOut(t) {
            return t < 0.5
                ? 2 * t * t
                : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        function drawHeart(progress, pulse = 1) {
            const totalPoints = 900;
            const pointsToDraw = Math.max(
                2,
                Math.floor(totalPoints * progress)
            );

            ctx.save();

            ctx.translate(width / 2, height / 2 + scale * 1.5);
            ctx.scale(scale * pulse, -scale * pulse);

            ctx.beginPath();

            for (let i = 0; i < pointsToDraw; i++) {
                const t = (i / (totalPoints - 1)) * Math.PI * 2;
                const x = heartX(t);
                const y = heartY(t);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.strokeStyle = "rgba(255, 55, 130, 0.95)";
            ctx.lineWidth = 0.13;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.shadowColor = "rgba(255, 40, 130, 0.9)";
            ctx.shadowBlur = 0.7;
            ctx.stroke();

            ctx.restore();
        }

        function drawGlow(progress, pulse) {
            const t = progress * Math.PI * 2;
            const x = heartX(t);
            const y = heartY(t);

            const screenX = width / 2 + x * scale * pulse;
            const screenY = height / 2 - (y - 1.5) * scale * pulse;

            const radius = 5 + Math.sin(performance.now() / 150) * 2;

            const gradient = ctx.createRadialGradient(
                screenX,
                screenY,
                0,
                screenX,
                screenY,
                radius * 5
            );

            gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
            gradient.addColorStop(0.2, "rgba(255, 100, 170, 0.9)");
            gradient.addColorStop(1, "rgba(255, 50, 130, 0)");

            ctx.beginPath();
            ctx.fillStyle = gradient;
            ctx.arc(screenX, screenY, radius * 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate(now) {
            ctx.clearRect(0, 0, width, height);

            drawParticles();

            const elapsed = now - animationStart;
            const rawProgress = Math.min(elapsed / animationDuration, 1);
            const progress = easeInOut(rawProgress);

            if (rawProgress < 1) {
                drawHeart(progress);
                drawGlow(progress, 1);
            } else {
                isFinished = true;

                const pulse = 1 + Math.sin((now - animationStart) / 450) * 0.035;

                drawHeart(1, pulse);
                drawGlow(1, pulse);
            }

            requestAnimationFrame(animate);
        }

        function restartAnimation() {
            animationStart = performance.now();
            isFinished = false;
        }

        window.addEventListener("resize", () => {
            resizeCanvas();
            createParticles();
        });

        canvas.addEventListener("click", restartAnimation);

        resizeCanvas();
        createParticles();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Для тебя ❤️</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle,#350015,#15000a 45%,#030003);font-family:Arial,sans-serif;cursor:pointer}canvas{position:fixed;inset:0;width:100%;height:100%}.content{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none}.message{margin-top:330px;text-align:center;color:#fff;opacity:0;font-size:clamp(20px,4vw,38px);letter-spacing:4px;text-shadow:0 0 10px #ff174f,0 0 25px #ff174f,0 0 50px #ff174f;transition:opacity 2s,transform 2s;transform:translateY(20px)}.message.show{opacity:1;transform:translateY(0)}.sub{margin-top:12px;font-size:clamp(11px,2vw,15px);letter-spacing:5px;color:#ffffff8c}.hint{position:fixed;bottom:25px;left:0;right:0;text-align:center;color:#ffffff4d;font-size:11px;letter-spacing:3px}</style></head><body><canvas id="canvas"></canvas><div class="content"><div class="message" id="message">Для тебя ❤️<div class="sub">просто потому что ты особенная</div></div></div><div class="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ СНОВА</div><script>const c=document.getElementById('canvas'),x=c.getContext('2d'),m=document.getElementById('message');let w,h,d,s,start=performance.now();const drawTime=5200,wait=1800;function resize(){d=devicePixelRatio||1;w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(d,0,0,d,0,0);s=Math.min(w,h)/42}addEventListener('resize',resize);resize();function hx(t){return 16*Math.sin(t)**3}function hy(t){return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}function ease(t){return t<.5?2*t*t:1-(-2*t+2)**2/2}const p=[];for(let i=0;i<250;i++)p.push({a:Math.random()*Math.PI*2,r:100+Math.random()*400,v:.0002+Math.random()*.001,z:Math.random()*2+.4,o:Math.random()*.45+.1});function heart(q){let cx=w/2,cy=h/2-20,T=ease(q)*Math.PI*2,N=700;x.beginPath();for(let i=0;i<=N;i++){let t=T*i/N,X=cx+hx(t)*s,Y=cy-hy(t)*s;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.lineWidth=13;x.strokeStyle='rgba(255,20,80,.08)';x.shadowBlur=45;x.shadowColor='#ff174f';x.stroke();x.beginPath();for(let i=0;i<=N;i++){let t=T*i/N,X=cx+hx(t)*s,Y=cy-hy(t)*s;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.lineWidth=2.4;x.strokeStyle='#ff3b6b';x.shadowBlur=20;x.stroke();if(q<1){let t=T,X=cx+hx(t)*s,Y=cy-hy(t)*s;x.beginPath();x.arc(X,Y,12,0,Math.PI*2);x.fillStyle='rgba(255,20,80,.15)';x.shadowBlur=30;x.fill();x.beginPath();x.arc(X,Y,4,0,Math.PI*2);x.fillStyle='#fff';x.shadowBlur=20;x.fill()}x.shadowBlur=0}function particles(t){let cx=w/2,cy=h/2;p.forEach(a=>{let A=a.a+t*a.v,X=cx+Math.cos(A)*a.r,Y=cy+Math.sin(A)*a.r;x.beginPath();x.arc(X,Y,a.z,0,Math.PI*2);x.fillStyle=`rgba(255,50,100,${a.o})`;x.fill()})}function loop(now){let e=now-start;x.clearRect(0,0,w,h);let cx=w/2,cy=h/2,g=x.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*.5);g.addColorStop(0,'rgba(255,20,80,.12)');g.addColorStop(.45,'rgba(255,0,70,.035)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);particles(e);if(e<drawTime){heart(e/drawTime);m.classList.remove('show')}else{let q=1+Math.sin(e*.003)*.025;x.save();x.translate(cx,cy-20);x.scale(q,q);x.translate(-cx,-(cy-20));heart(1);x.restore();if(e>drawTime+wait)m.classList.add('show')}requestAnimationFrame(loop)}requestAnimationFrame(loop);document.body.onclick=()=>{start=performance.now();m.classList.remove('show')}</script></body></html>
